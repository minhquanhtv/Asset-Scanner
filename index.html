<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Scanner Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Giao diện chuẩn Dark Mode điện thoại chuyên nghiệp */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1016 0%, #191b2a 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #b55fe6, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-dashboard {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .camera-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .camera-icon { font-size: 48px; color: #8a8d9f; margin-bottom: 15px; }
        .camera-hint { color: #8a8d9f; font-size: 14px; margin-bottom: 20px; }
        
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #d946ef 100%);
            border: none;
            color: white;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; padding: 14px 16px; color: white; font-size: 15px; outline: none;
        }
        .btn-search {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; width: 50px; border-radius: 14px; cursor: pointer;
        }
        .error-box {
            background: rgba(233, 69, 96, 0.1); border: 1px solid #e94560;
            border-radius: 16px; padding: 16px; margin-top: 20px; display: none;
        }
        #reader { width: 100%; background: #000; border-radius: 16px; display: none; overflow: hidden; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>Asset Scanner Pro</h1>
            <div style="font-size: 11px; color: #6e7191; margin-top: 4px;">Hệ thống Kiểm kê Tài sản Cơ quanTTPH</div>
        </div>
        <button class="btn-dashboard"><i class="fa-solid fa-border-all"></i> Dashboard</button>
    </div>

    <div class="camera-box">
        <div id="scanner-ui">
            <div class="camera-icon">📷</div>
            <div class="camera-hint">Nhấn để mở camera và bắt đầu quét mã vạch tài sản</div>
            <button class="btn-gradient" onclick="startScanning()">Mở Camera</button>
        </div>
        <div id="reader"></div>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="manualInput" placeholder="Hoặc nhập mã tài sản bằng tay...">
        <button class="btn-search" onclick="checkManualAsset()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="error-box" id="errorBox">
        <div style="color: #ff6b81; font-size: 14px;">
            <strong>❌ Thông báo:</strong> <span id="errorText"></span>
        </div>
    </div>
</div>

<script>
    let html5QrcodeScanner;

    // === ĐÂY LÀ NƠI CHỨA DỮ LIỆU TỪ FILE EXCEL CỦA ANH ===
    // Em đã gộp chung cả 2 Sheet (Cột E của Chỉnh 3 phòng và Cột D của CCDC) vào đây.
    // Anh có thể tự nhập thêm các dòng thiết bị khác theo đúng cấu trúc bên dưới.
    const DATA_TAI_SAN = [
        // Dữ liệu trích từ sheet: Chỉnh cho 3 phòng (Mã tài sản nằm ở cột E)
        { ma: "3010101223001", ten: "Máy chủ Dell (Kèm đĩa CD Windows Server Standard 2019), Model:PowerEdge R350", nuoc: "Malaysia", phòng: "KT", nguoi_ql: "Xuân", vi_tri: "A2-R6: DDR2" },
        { ma: "302099902894004", ten: "Bàn trộn tín hiệu âm thanh số 24 kênh - Allen & Heath, Model:Qu-24", nuoc: "Trung Quốc", phòng: "PH", nguoi_ql: "Lam", vi_tri: "Máy VP trong lầu 1 PH mới" },
        { ma: "302099902935001", ten: "Bàn trộn hình Sony 24 ngõ vào, chuẩn 4K, 2ME (Khung chính Model: XVS-G1)", nuoc: "Nhật", phòng: "KT", nguoi_ql: "Thanh", vi_tri: "F1: sw chính" },
        { ma: "302099907300003", ten: "Máy quay phim vác vai Sony, Model:PMW-320, No:103447", nuoc: "Nhật", phòng: "KT", nguoi_ql: "Xuân", vi_tri: "A2-MC - cam 1" },
        { ma: "302099902920001002", ten: "Menu panel Sony, Model:ICP-6511, No:10852", nuoc: "Nhật", phòng: "KT", nguoi_ql: "Thanh", vi_tri: "F1: sw chính" },
        
        // Dữ liệu trích từ sheet: CCDC (Mã tài sản nằm ở cột D)
        { ma: "3010102337034", ten: "Máy tính desktop Dell, Serial: GX3372S", nuoc: "Malaysia", phòng: "PH", nguoi_ql: "Khanh", vi_tri: "Chép file HTVC cũ" },
        { ma: "3010102361034", ten: "Máy tính desktop Dell, Serial: CX3VD2S", nuoc: "Malaysia", phòng: "KT", nguoi_ql: "Hà", vi_tri: "Trên tủ hồ sơ" },
        { ma: "H90111090008", ten: "Màn hình tivi LED 32\" KD-32W830K, Serial: 8624785", nuoc: "Việt Nam", phòng: "KT", nguoi_ql: "Quân", vi_tri: "Phòng làm việc" },
        { ma: "H90111100001", ten: "Máy Chromakey Ultimatte 12 HD, Serial: 10904474", nuoc: "Singapore", phòng: "KT", nguoi_ql: "Quân", vi_tri: "RACK 7 A2" },
        { ma: "H90111840001", ten: "Bộ thu micro không dây Shure QLXD4, Serial: 3CJ27078059", nuoc: "Mỹ/China", phòng: "KT", nguoi_ql: "Xuân", vi_tri: "A2 control, w17-18-19-20" }
    ];

    function startScanning() {
        const errorBox = document.getElementById('errorBox');
        const scannerUi = document.getElementById('scanner-ui');
        const readerDiv = document.getElementById('reader');
        errorBox.style.display = 'none';

        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText, decodedResult) => {
                stopScanning();
                processAssetSearch(decodedText);
            },
            (errorMessage) => { }
        )
        .then(() => {
            scannerUi.style.display = 'none';
            readerDiv.style.display = 'block';
        })
        .catch((err) => {
            document.getElementById('errorText').innerText = "Vui lòng cấp quyền mở Camera trên trình duyệt điện thoại của bạn!";
            errorBox.style.display = 'block';
        });
    }

    function stopScanning() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('scanner-ui').style.display = 'flex';
                document.getElementById('reader').style.display = 'none';
            }).catch(err => console.error(err));
        }
    }

    function checkManualAsset() {
        const code = document.getElementById('manualInput').value.trim();
        if(code) {
            processAssetSearch(code);
        } else {
            alert('Vui lòng nhập mã tài sản!');
        }
    }

    // Hàm tra cứu trực tiếp dữ liệu cứng được khai báo ở trên
    function processAssetSearch(maCanTim) {
        // Dò tìm chính xác mã tài sản (bỏ khoảng trắng thừa nếu có)
        const asset = DATA_TAI_SAN.find(item => String(item.ma).trim() === String(maCanTim).trim());

        if (asset) {
            // Hiển thị hộp thoại chi tiết khi tìm thấy thiết bị
            alert(`🎉 THÔNG TIN TÀI SẢN TÌM THẤY:\n----------------------------------\n• Mã số: ${asset.ma}\n• Tên tài sản: ${asset.ten}\n• Xuất xứ: ${asset.nuoc}\n• Bộ phận quản lý: Phòng ${asset.phòng} (${asset.nguoi_ql})\n• Vị trí lắp đặt: ${asset.vi_tri}`);
        } else {
            alert(`❌ Không tìm thấy thông tin cho mã tài sản này: ${maCanTim}`);
        }
    }
</script>

</body>
</html>
