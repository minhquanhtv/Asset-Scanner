<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Scanner Pro</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f1016 0%, #191b2a 100%);
            color: #ffffff; min-height: 100vh; display: flex; justify-content: center;
        }
        .app-container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 {
            font-size: 20px; font-weight: 700; margin: 0;
            background: linear-gradient(to right, #b55fe6, #e94560);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .camera-box {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px; padding: 40px 20px; text-align: center; margin-bottom: 20px;
            min-height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative;
        }
        .camera-icon { font-size: 48px; color: #8a8d9f; margin-bottom: 15px; }
        .camera-hint { color: #8a8d9f; font-size: 14px; margin-bottom: 20px; }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #d946ef 100%); border: none; color: white;
            padding: 12px 35px; font-size: 16px; font-weight: 600; border-radius: 30px; cursor: pointer;
        }
        .search-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input {
            flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; padding: 14px 16px; color: white; font-size: 15px; outline: none;
        }
        .btn-search {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; width: 50px; border-radius: 14px; cursor: pointer;
        }
        #reader { width: 100%; background: #000; border-radius: 16px; display: none; overflow: hidden; }
        .status-msg { color: #8a8d9f; font-size: 13px; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <h1>Asset Scanner Pro_MQUAN</h1>
            <div class="status-msg" id="loadStatus">⏳ Đang tải dữ liệu Excel...</div>
        </div>
    </div>

    <div class="camera-box">
        <div id="scanner-ui">
            <div class="camera-icon">📷</div>
            <div class="camera-hint">Nhấn để mở camera và bắt đầu quét mã vạch tài sản</div>
            <button class="btn-gradient" id="btnStart" onclick="startScanning()" disabled>Vui lòng đợi tải file...</button>
        </div>
        <div id="reader"></div>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="manualInput" placeholder="Hoặc nhập mã tài sản bằng tay...">
        <button class="btn-search" onclick="checkManualAsset()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
</div>

<script>
    let html5QrcodeScanner;
    let excelDatabase = []; // Nơi gom toàn bộ dữ liệu Excel sau khi đọc

    // TỰ ĐỘNG ĐỌC FILE EXCEL ĐÃ UP LÊN GITHUB KHI TRANG WEB VỪA MỞ
    window.onload = function() {
        // Đọc file dữ liệu database.xlsx nằm cùng thư mục
        fetch('database.xlsx')
            .then(res => res.arrayBuffer())
            .then(ab => {
                const wb = XLSX.read(new Uint8Array(ab), { type: 'array' });
                
                // Quét qua tất cả các Sheet có trong file Excel (Gồm Chinh cho 3 phong, CCDC...)
                wb.SheetNames.forEach(sheetName => {
                    const worksheet = wb.Sheets[sheetName];
                    // Chuyển sheet thành mảng dữ liệu
                    const rowData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    // Tìm hàng tiêu đề để biết vị trí các cột
                    let headerRow = [];
                    let dataStartIdx = 0;
                    for(let i=0; i<rowData.length; i++) {
                        if(rowData[i].includes("Số hiệu") || rowData[i].includes("Ký hiệu")) {
                            headerRow = rowData[i];
                            dataStartIdx = i + 1;
                            break;
                        }
                    }

                    // Nếu không tìm thấy cấu trúc chuẩn, lấy tạm hàng đầu tiên có dữ liệu làm tiêu đề
                    if(headerRow.length === 0 && rowData.length > 0) {
                        headerRow = rowData[0];
                        dataStartIdx = 1;
                    }

                    // Đẩy dữ liệu vào kho lưu trữ chung
                    for(let j = dataStartIdx; j < rowData.length; j++) {
                        let row = rowData[j];
                        if(!row || row.length === 0) continue;

                        // Tạo object chuẩn hóa thông tin từng dòng
                        let record = { _sheet: sheetName };
                        headerRow.forEach((header, colIdx) => {
                            if(header) {
                                record[String(header).trim()] = row[colIdx];
                            }
                        });
                        excelDatabase.push(record);
                    }
                });

                document.getElementById('loadStatus').innerText = `✅ Đã nhận ${excelDatabase.length} dòng dữ liệu!`;
                document.getElementById('btnStart').innerText = "Mở Camera";
                document.getElementById('btnStart').disabled = false;
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loadStatus').innerText = "❌ Lỗi: Không tìm thấy file 'database.xlsx' trên GitHub!";
            });
    };

    function startScanning() {
        const scannerUi = document.getElementById('scanner-ui');
        const readerDiv = document.getElementById('reader');

        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                stopScanning();
                processAssetSearch(decodedText);
            },
            (err) => {}
        )
        .then(() => {
            scannerUi.style.display = 'none';
            readerDiv.style.display = 'block';
        })
        .catch(err => alert("Vui lòng cấp quyền camera!"));
    }

    function stopScanning() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById('scanner-ui').style.display = 'flex';
                document.getElementById('reader').style.display = 'none';
            });
        }
    }

    function checkManualAsset() {
        const code = document.getElementById('manualInput').value.trim();
        if(code) processAssetSearch(code);
        else alert('Vui lòng nhập mã tài sản!');
    }

    // HÀM TRA CỨU MÃ TÀI SẢN TRONG FILE EXCEL ĐÃ ĐỌC
    function processAssetSearch(maCanTim) {
        if(excelDatabase.length === 0) {
            alert("Dữ liệu đang tải, vui lòng đợi vài giây!");
            return;
        }

        // Tìm dòng có cột "Số hiệu" hoặc "Ký hiệu" trùng với mã quét
        const found = excelDatabase.find(item => {
            let maTrongFile = item["Số hiệu"] || item["Ký hiệu"] || "";
            return String(maTrongFile).trim() === String(maCanTim).trim();
        });

        if (found) {
            // Lấy thông tin linh hoạt theo tiêu đề các cột có trong các sheet của anh
            let ten = found["Tên tài sản"] || found["TÊN CCDC"] || "Không rõ tên";
            let phong = found["Phòng"] || "---";
            let nguoi = found["Người QL"] || found["Người quản lý"] || "---";
            let vitri = found["Vị trí"] || found["Chỗ đặt"] || "---";

            alert(`🎉 TÌM THẤY TÀI SẢN (${found._sheet}):\n----------------------------------\n• Mã số: ${maCanTim}\n• Tên máy: ${ten}\n• Bộ phận: Phòng ${phong} (${nguoi})\n• Vị trí lắp đặt: ${vitri}`);
        } else {
            alert(`❌ Không tìm thấy thông tin cho mã này: ${maCanTim}`);
        }
    }
</script>

</body>
</html>
